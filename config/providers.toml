[providers.claude]
kind = "command"
command = "claude"
args = ["-p"]
role = "investigator"

[providers.gpt]
kind = "command"
command = "codex"
args = ["exec"]
role = "skeptic"

[providers.gwen]
kind = "command"
command = "gwen"
